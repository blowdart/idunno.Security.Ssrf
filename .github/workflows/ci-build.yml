name: CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev/*'
      - 'version/*'
    paths-ignore:
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches:
      - 'main'
      - 'version/*'

permissions:
  contents: read

env:
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TEST_RESULTS: ${{ github.workspace }}/TestResults
  COVERAGE_REPORT: ${{ github.workspace}}/coveragereport

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: cibuild
    permissions:
      contents: read
      issues: read
      pull-requests: write
      checks: write
    steps:
      ## Do not harden the runner in this workflow since it needs to run build and test tasks that may require network access and other permissions.

    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
        persist-credentials: false
 
    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: | 
          8.0.x
          9.0.x
          10.0.x

    - name: 'Report SDK versions'
      run : dotnet --info

    - name: 'Build'
      id: build
      run: dotnet build --configuration Debug

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-artifacts
        path: |
          src/**/idunno.*.nupkg
          src/**/idunno.*.dll
          src/**/idunno.*.deps.json
          src/**/idunno.*.xml
        retention-days: 5

    - name: 'Test'
      id: test
      shell: bash
      run: dotnet test --configuration Debug --no-build --no-restore --results-directory ${TEST_RESULTS} --coverlet --report-xunit-junit

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
      if: always()
      with:
        files: ${{ env.TEST_RESULTS }}/*.junit.xml

    - name: Upload Test Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: ${{ env.TEST_RESULTS }}/*.junit.xml
        retention-days: 5

    - name: 'Generate Full Code Coverage Reports'
      uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # 5.5.12
      with:
        reports: ${{ env.TEST_RESULTS }}/coverage.cobertura.*.xml
        targetdir: "${{ env.COVERAGE_REPORT }}"
        reporttypes: "Cobertura,MarkdownSummaryGithub" 
        verbosity: "Info" 
        title: "Code Coverage" 
        tag: "${{ github.run_number }}_${{ github.run_id }}"
        toolpath: "reportgeneratortool"
        license: ${{ secrets.REPORT_GENERATOR_LICENSE }}

    - name: Append coverage report to build summary
      shell: bash
      run: cat ${COVERAGE_REPORT}/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Upload Code Coverage Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-results
        path: | 
          ${{ env.COVERAGE_REPORT }}
          ${{ env.TEST_RESULTS }}/coverage.cobertura.*.xml
        retention-days: 5

